<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 จิ๊กซอว์รูปใครน้าา?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgm" loop src="song.mp3"></audio>
    <div class="card">
        <h1>🧩 จิ๊กซอว์รูปใครน้าา?</h1>
        <p>ลากรูปไปสลับตำแหน่งกัน... ให้กลายเป็นรูปสวยๆ นะ💕</p>
        <div id="board" class="board"></div>
        <p class="hint">👆 แตะค้างที่รูป แล้วลากไปวางสลับกับรูปอื่นได้เลยจ้า!</p>
    </div>
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 ยินดีด้วยยย! เรียงภาพถูกแล้ว</h2>
            <p>คุณแม่คนเก่ง เก่งที่สุดในโลกเลยยย 🥰</p>
            <p class="love">รักแม่ที่สุดในสามโลกกกก❤️</p>
            <button onclick="restartGame()">เล่นอีกครั้ง</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
